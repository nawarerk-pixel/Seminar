<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แอดมิน — จัดการงานประชุม</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tab-btn { padding:9px 16px; border-radius:999px; border:1.5px solid var(--line); background:#fff; cursor:pointer; font-family:var(--font-body); font-weight:600; font-size:0.88rem; }
  .tab-btn.active { background: var(--ink); color:#fff; border-color:var(--ink); }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }
  table.roster { width:100%; border-collapse:collapse; margin-top:10px; }
  table.roster th, table.roster td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); font-size:0.88rem; }
  table.roster input { padding:6px 8px; font-size:0.85rem; }
  .row-actions { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
  .hist-row { display:flex; justify-content:space-between; align-items:center; padding:12px; border:1.5px solid var(--line); border-radius:10px; margin-bottom:8px; background:#fff; flex-wrap:wrap; gap:8px; }
  .manage-row { display:flex; justify-content:space-between; align-items:center; padding:12px; border:1.5px solid var(--line); border-radius:10px; margin-bottom:8px; background:#fff; flex-wrap:wrap; gap:8px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="brand-school">โรงเรียนท่าตูมประชาเสริมวิทย์</span>แอดมิน<small>จัดการงานประชุมทั้งหมด</small></div>
    <div style="display:flex;gap:8px">
      <button class="btn outline sm" id="logoutBtn" style="display:none;color:#fff;border-color:rgba(255,255,255,0.35)">ออกจากระบบ</button>
      <a href="index.html" class="btn outline sm" style="color:#fff;border-color:rgba(255,255,255,0.35)">← หน้าหลัก</a>
    </div>
  </div>

  <div class="wrap">
    <div class="card" id="pinCard">
      <label>รหัส PIN แอดมิน</label>
      <div style="display:flex;gap:10px">
        <input type="password" id="pinInput" placeholder="กรอก PIN">
        <button class="btn brass" id="pinBtn">เข้าสู่ระบบ</button>
      </div>
    </div>

    <div id="mainArea" style="display:none">
      <div class="tabs">
        <button class="tab-btn active" data-tab="create">+ สร้างงานใหม่</button>
        <button class="tab-btn" data-tab="manage">จัดการงานที่เปิดอยู่</button>
        <button class="tab-btn" data-tab="members">จัดการกลุ่มสมาชิก</button>
        <button class="tab-btn" data-tab="history">ประวัติย้อนหลัง</button>
      </div>

      <!-- ===== CREATE ===== -->
      <div class="tab-panel active" id="tab-create">
        <div class="card">
          <div class="field"><label>ชื่องานประชุม</label><input type="text" id="evName" placeholder="เช่น ประชุมสภานักเรียน ครั้งที่ 3/2569"></div>
          <div style="display:flex;gap:14px;flex-wrap:wrap">
            <div class="field" style="flex:1;min-width:160px"><label>วันที่</label><input type="date" id="evDate"></div>
            <div class="field" style="flex:1;min-width:160px"><label>เกณฑ์องค์ประชุม (%)</label><input type="number" id="evQuorum" value="50" min="1" max="100"></div>
          </div>

          <div class="field">
            <label>โหลดรายชื่อจากกลุ่มที่มีอยู่</label>
            <div style="display:flex;gap:10px">
              <select id="groupSelect"><option>กำลังโหลดกลุ่ม...</option></select>
              <button class="btn outline sm" id="loadGroupBtn">โหลดเข้าตาราง</button>
            </div>
          </div>

          <div class="row-actions">
            <button class="btn outline sm" id="addRowBtn">+ เพิ่มแถวคนเข้าประชุม</button>
            <button class="btn outline sm" id="clearRosterBtn">ล้างตาราง</button>
            <span class="muted" style="align-self:center">ทั้งหมด <b id="rosterCount">0</b> คน</span>
          </div>
          <div style="max-height:340px;overflow-y:auto">
            <table class="roster">
              <thead><tr><th>ชื่อ-นามสกุล</th><th>ฝ่าย/หมวด</th><th></th></tr></thead>
              <tbody id="rosterBody"></tbody>
            </table>
          </div>

          <button class="btn green block" id="createEventBtn" style="margin-top:16px">สร้างงานประชุม</button>
        </div>
      </div>

      <!-- ===== MANAGE ===== -->
      <div class="tab-panel" id="tab-manage">
        <div class="card">
          <h2 style="font-size:1.05rem;margin-bottom:10px">งานที่เปิดอยู่</h2>
          <div id="manageList"><p class="muted">กำลังโหลด...</p></div>
        </div>
      </div>

      <!-- ===== MEMBERS MASTER ===== -->
      <div class="tab-panel" id="tab-members">
        <div class="card">
          <h2 style="font-size:1.05rem;margin-bottom:10px">กลุ่มที่มีอยู่</h2>
          <div id="groupsList"><p class="muted">กำลังโหลด...</p></div>
        </div>

        <div class="card">
          <h2 style="font-size:1.05rem;margin-bottom:14px">+ เพิ่มสมาชิกเข้ากลุ่ม</h2>

          <div class="field">
            <label>ชื่อกลุ่ม (พิมพ์ชื่อใหม่เพื่อสร้างกลุ่ม หรือเลือกจากกลุ่มเดิมเพื่อเพิ่มคนเข้าไป)</label>
            <input type="text" id="mGroupName" list="mGroupOptions" placeholder="เช่น สภาเด็ก 2569">
            <datalist id="mGroupOptions"></datalist>
          </div>

          <div class="field">
            <label>วางรายชื่อจาก Excel/Google Sheets (คอลัมน์ ชื่อ [Tab] ฝ่าย — 1 คนต่อบรรทัด)</label>
            <textarea id="mPasteArea" rows="4" placeholder="สมชาย ใจดี	ฝ่ายวิชาการ&#10;สมหญิง รักเรียน	ฝ่ายกิจกรรม"></textarea>
            <button class="btn outline sm" id="mParsePasteBtn" style="margin-top:8px">↓ แปลงลงตารางด้านล่าง</button>
          </div>

          <div class="row-actions">
            <button class="btn outline sm" id="mAddRowBtn">+ เพิ่มแถว</button>
            <button class="btn outline sm" id="mClearBtn">ล้างตาราง</button>
            <span class="muted" style="align-self:center">ทั้งหมด <b id="mCount">0</b> คน</span>
          </div>
          <div style="max-height:300px;overflow-y:auto">
            <table class="roster">
              <thead><tr><th>ชื่อ-นามสกุล</th><th>ฝ่าย/หมวด</th><th></th></tr></thead>
              <tbody id="mBody"></tbody>
            </table>
          </div>

          <button class="btn green block" id="mSaveBtn" style="margin-top:16px">บันทึกเข้ากลุ่ม</button>
        </div>
      </div>

      <!-- ===== HISTORY ===== -->
      <div class="tab-panel" id="tab-history">
        <div class="card">
          <h2 style="font-size:1.05rem;margin-bottom:10px">งานที่ปิดแล้ว</h2>
          <div id="historyList"><p class="muted">กำลังโหลด...</p></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    let currentPin = getSavedPin();
    let roster = []; // {member_id, name, department}
    let groupsData = {};

    async function tryPin(pin) {
      const v = await apiCall('verifyPin', { pin });
      if (v.ok && v.valid) {
        currentPin = pin; savePin(pin);
        document.getElementById('pinCard').style.display = 'none';
        document.getElementById('mainArea').style.display = 'block';
        document.getElementById('logoutBtn').style.display = 'inline-block';
        loadGroups(); loadManage(); loadHistory();
        const now = new Date();
        const localDate = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
        document.getElementById('evDate').value = localDate;
      } else toast('PIN ไม่ถูกต้อง', 'err');
    }
    if (currentPin) tryPin(currentPin);
    document.getElementById('pinBtn').onclick = () => tryPin(document.getElementById('pinInput').value);
    document.getElementById('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryPin(e.target.value); });

    document.getElementById('logoutBtn').onclick = () => {
      clearPin();
      currentPin = '';
      document.getElementById('pinInput').value = '';
      document.getElementById('mainArea').style.display = 'none';
      document.getElementById('logoutBtn').style.display = 'none';
      document.getElementById('pinCard').style.display = 'block';
    };

    // Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      };
    });

    // ===== Roster table =====
    function renderRoster() {
      document.getElementById('rosterCount').textContent = roster.length;
      document.getElementById('rosterBody').innerHTML = roster.map((m, i) => `
        <tr>
          <td><input value="${m.name}" onchange="roster[${i}].name=this.value"></td>
          <td><input value="${m.department || ''}" onchange="roster[${i}].department=this.value"></td>
          <td><button class="btn danger sm" onclick="removeRow(${i})">ลบ</button></td>
        </tr>
      `).join('');
    }
    function removeRow(i) { roster.splice(i, 1); renderRoster(); }
    document.getElementById('addRowBtn').onclick = () => {
      roster.push({ member_id: 'M_' + Date.now() + '_' + Math.floor(Math.random() * 999), name: '', department: '' });
      renderRoster();
    };
    document.getElementById('clearRosterBtn').onclick = () => { roster = []; renderRoster(); };

    async function loadGroups() {
      const res = await apiCall('getGroups', {});
      const sel = document.getElementById('groupSelect');
      const dlist = document.getElementById('mGroupOptions');
      const groupsList = document.getElementById('groupsList');

      if (!res.ok || !Object.keys(res.groups).length) {
        sel.innerHTML = '<option value="">ยังไม่มีกลุ่มที่บันทึกไว้</option>';
        dlist.innerHTML = '';
        groupsList.innerHTML = '<p class="muted">ยังไม่มีกลุ่มที่บันทึกไว้ เพิ่มได้จากด้านล่าง</p>';
        return;
      }
      groupsData = res.groups;
      const names = Object.keys(res.groups);

      sel.innerHTML = names.map(g => `<option value="${g}">${g} (${res.groups[g].length} คน)</option>`).join('');
      dlist.innerHTML = names.map(g => `<option value="${g}">`).join('');

      groupsList.innerHTML = names.map(g => `
        <div class="manage-row" style="align-items:flex-start">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
              <b>${g}</b><span class="muted">${res.groups[g].length} คน</span>
              <button class="btn outline sm" onclick="toggleGroupMembers(this)">ดูรายชื่อ</button>
              <button class="btn danger sm" onclick="deleteGrp('${g}')">ลบทั้งกลุ่ม</button>
            </div>
            <div class="group-members" style="display:none;margin-top:10px">
              ${res.groups[g].map(m => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:0.85rem">
                  <span>${m.name}${m.department ? ' <span class="muted">(' + m.department + ')</span>' : ''}</span>
                  <button class="btn danger sm" onclick="deleteMbr('${m.member_id}')">ลบ</button>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `).join('');
    }

    function toggleGroupMembers(btn) {
      const box = btn.closest('div').nextElementSibling;
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    async function deleteGrp(groupName) {
      if (!confirm(`ลบกลุ่ม "${groupName}" ทั้งกลุ่มใช่หรือไม่? (ไม่กระทบงานประชุมที่สร้างไปแล้ว)`)) return;
      const res = await apiCall('deleteGroup', { group_name: groupName, pin: currentPin });
      if (res.ok) { toast(`ลบแล้ว ${res.deleted_count} คน`, 'ok'); loadGroups(); }
      else toast('ไม่สำเร็จ', 'err');
    }

    async function deleteMbr(memberId) {
      if (!confirm('ลบคนนี้ออกจากกลุ่มใช่หรือไม่?')) return;
      const res = await apiCall('deleteMember', { member_id: memberId, pin: currentPin });
      if (res.ok) { toast('ลบแล้ว', 'ok'); loadGroups(); }
      else toast('ไม่สำเร็จ', 'err');
    }

    // ===== เพิ่มสมาชิกใหม่: ตาราง + paste =====
    let newMemberBatch = [];
    function renderMemberBatch() {
      document.getElementById('mCount').textContent = newMemberBatch.length;
      document.getElementById('mBody').innerHTML = newMemberBatch.map((m, i) => `
        <tr>
          <td><input value="${m.name}" onchange="newMemberBatch[${i}].name=this.value"></td>
          <td><input value="${m.department || ''}" onchange="newMemberBatch[${i}].department=this.value"></td>
          <td><button class="btn danger sm" onclick="removeMemberRow(${i})">ลบ</button></td>
        </tr>
      `).join('');
    }
    function removeMemberRow(i) { newMemberBatch.splice(i, 1); renderMemberBatch(); }
    document.getElementById('mAddRowBtn').onclick = () => { newMemberBatch.push({ name: '', department: '' }); renderMemberBatch(); };
    document.getElementById('mClearBtn').onclick = () => { newMemberBatch = []; renderMemberBatch(); };

    document.getElementById('mParsePasteBtn').onclick = () => {
      const raw = document.getElementById('mPasteArea').value;
      const lines = raw.split('\n').map(l => l.trim()).filter(l => l);
      if (!lines.length) { toast('ไม่มีข้อมูลให้แปลง', 'err'); return; }
      lines.forEach(line => {
        const cols = line.split('\t');
        const name = (cols[0] || '').trim();
        const department = (cols[1] || '').trim();
        if (name) newMemberBatch.push({ name, department });
      });
      document.getElementById('mPasteArea').value = '';
      renderMemberBatch();
      toast(`เพิ่ม ${lines.length} แถวลงตารางแล้ว ตรวจสอบก่อนบันทึก`, 'ok');
    };

    document.getElementById('mSaveBtn').onclick = async () => {
      const groupName = document.getElementById('mGroupName').value.trim();
      const clean = newMemberBatch.filter(m => m.name.trim());
      if (!groupName) { toast('กรุณากรอกชื่อกลุ่ม', 'err'); return; }
      if (!clean.length) { toast('ยังไม่มีรายชื่อในตาราง', 'err'); return; }

      const btn = document.getElementById('mSaveBtn');
      btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
      const res = await apiCall('addMembers', { group_name: groupName, members: clean, pin: currentPin });
      btn.disabled = false; btn.textContent = 'บันทึกเข้ากลุ่ม';

      if (res.ok) {
        toast(`บันทึก ${res.added_count} คนเข้ากลุ่ม "${groupName}" แล้ว`, 'ok');
        newMemberBatch = []; renderMemberBatch();
        document.getElementById('mGroupName').value = '';
        loadGroups();
      } else toast('บันทึกไม่สำเร็จ: ' + res.error, 'err');
    };
    document.getElementById('loadGroupBtn').onclick = () => {
      const g = document.getElementById('groupSelect').value;
      if (!g || !groupsData[g]) { toast('ไม่พบกลุ่มนี้', 'err'); return; }
      groupsData[g].forEach(m => roster.push({ member_id: m.member_id, name: m.name, department: m.department || '' }));
      renderRoster();
      toast(`โหลด ${groupsData[g].length} รายชื่อแล้ว`, 'ok');
    };

    document.getElementById('createEventBtn').onclick = async () => {
      const name = document.getElementById('evName').value.trim();
      const date = document.getElementById('evDate').value;
      const quorum = Number(document.getElementById('evQuorum').value) || 50;
      const cleanRoster = roster.filter(m => m.name.trim());
      if (!name) { toast('กรุณากรอกชื่องาน', 'err'); return; }
      if (!cleanRoster.length) { toast('กรุณาเพิ่มรายชื่อผู้เข้าประชุมอย่างน้อย 1 คน', 'err'); return; }

      const btn = document.getElementById('createEventBtn');
      btn.disabled = true; btn.textContent = 'กำลังสร้าง...';
      const res = await apiCall('createEvent', { name, date, quorum_pct: quorum, roster: cleanRoster, pin: currentPin });
      btn.disabled = false; btn.textContent = 'สร้างงานประชุม';

      if (res.ok) {
        toast('สร้างงานประชุมสำเร็จ', 'ok');
        document.getElementById('evName').value = ''; roster = []; renderRoster();
        loadManage();
        document.querySelector('[data-tab=manage]').click();
      } else toast('สร้างไม่สำเร็จ: ' + res.error, 'err');
    };

    // ===== Manage active events =====
    async function loadManage() {
      const res = await apiCall('listEvents', { filter: 'active' });
      const el = document.getElementById('manageList');
      if (!res.ok || !res.events.length) { el.innerHTML = '<p class="muted">ไม่มีงานที่เปิดอยู่</p>'; return; }
      el.innerHTML = res.events.map(ev => `
        <div class="manage-row">
          <div>
            <div style="font-weight:600">${ev.name}</div>
            <div class="muted">${fmtDate(ev.date)} · เกณฑ์ ${ev.quorum_pct}%</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <a class="btn outline sm" href="checkin.html?event=${ev.event_id}" target="_blank">เช็คชื่อ</a>
            <a class="btn outline sm" href="secretary.html?event=${ev.event_id}" target="_blank">เลขา</a>
            <a class="btn outline sm" href="display.html?event=${ev.event_id}" target="_blank">จอแสดงผล</a>
            <button class="btn danger sm" onclick="closeEv('${ev.event_id}')">ปิดงาน</button>
          </div>
        </div>
      `).join('');
    }
    async function closeEv(id) {
      if (!confirm('ปิดงานประชุมนี้ใช่หรือไม่? จะไม่สามารถเช็คชื่อเพิ่มได้อีก')) return;
      const res = await apiCall('closeEvent', { event_id: id, pin: currentPin });
      if (res.ok) { toast('ปิดงานแล้ว', 'ok'); loadManage(); loadHistory(); }
      else toast('ไม่สำเร็จ', 'err');
    }

    async function reopenEv(id) {
      if (!confirm('เปิดงานประชุมนี้อีกครั้งใช่หรือไม่? จะกลับมาเช็คชื่อ/ยืนยันสิทธิ์ต่อได้')) return;
      const res = await apiCall('reopenEvent', { event_id: id, pin: currentPin });
      if (res.ok) { toast('เปิดงานอีกครั้งแล้ว', 'ok'); loadManage(); loadHistory(); }
      else toast('ไม่สำเร็จ', 'err');
    }

    // ===== History =====
    async function loadHistory() {
      const res = await apiCall('getHistory', { pin: currentPin });
      const el = document.getElementById('historyList');
      if (!res.ok || !res.history.length) { el.innerHTML = '<p class="muted">ยังไม่มีงานที่ปิดแล้ว</p>'; return; }
      el.innerHTML = res.history.map(h => `
        <div class="hist-row">
          <div>
            <div style="font-weight:600">${h.name}</div>
            <div class="muted">${fmtDate(h.date)} · ${h.confirmed_count}/${h.total_roster} คน (${h.percentage}%)</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="pill ${h.quorum_met ? 'green' : 'red'}">${h.quorum_met ? '✓ ครบองค์ประชุม' : '✗ ไม่ครบองค์ประชุม'}</span>
            <a class="btn outline sm" href="display.html?event=${h.event_id}" target="_blank">ดูจอแสดงผล</a>
            <button class="btn brass sm" onclick="reopenEv('${h.event_id}')">↺ เปิดอีกครั้ง</button>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
