<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เช็คชื่อเข้าประชุม</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand" id="eventTitle"><span class="brand-school">โรงเรียนท่าตูมประชาเสริมวิทย์</span>เช็คชื่อเข้าประชุม<small>เลือกชื่อของท่านแล้วกดยืนยัน</small></div>
    <a href="index.html" class="btn outline sm" style="color:#fff;border-color:rgba(255,255,255,0.35)">← งานอื่น</a>
  </div>

  <div class="wrap" style="max-width:560px">
    <div class="card">
      <p class="muted" id="loadingMsg" style="display:flex;align-items:center;gap:8px">
        <span class="spinner"></span> กำลังโหลดรายชื่อ...
      </p>
      <div class="field combobox">
        <label>ชื่อ-นามสกุลของท่าน</label>
        <input type="text" id="memberSearch" placeholder="กำลังโหลดรายชื่อ..." autocomplete="off" disabled>
        <div class="combobox-results" id="memberResults"></div>
      </div>
      <button class="btn brass block" id="submitBtn">✓ ยืนยันเข้าประชุม</button>
      <p class="muted" style="margin-top:10px">หลังกดยืนยันแล้ว รายชื่อของท่านจะรอเลขาสภาตรวจสอบและยืนยันสิทธิ์อีกครั้ง</p>
    </div>

    <div class="card" id="doneCard" style="display:none;text-align:center">
      <div style="font-size:2.4rem">✅</div>
      <h2 style="font-size:1.3rem;margin:6px 0">เช็คชื่อสำเร็จ</h2>
      <p class="muted" id="doneMsg"></p>
      <button class="btn outline block" style="margin-top:12px" onclick="location.reload()">เช็คชื่อคนถัดไป</button>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const eventId = qs('event');
    if (!eventId) document.body.innerHTML = '<div class="wrap"><div class="card">ไม่พบงานประชุม กรุณากลับไปหน้าเลือกงาน</div></div>';

    let fullRoster = [];
    let selectedMemberId = '';

    async function init() {
      const [detail, res] = await Promise.all([
        apiCall('getEventDetail', { event_id: eventId }),
        apiCall('getRoster', { event_id: eventId })
      ]);

      document.getElementById('loadingMsg').style.display = 'none';

      if (detail.ok) {
        document.getElementById('eventTitle').innerHTML =
          `<span class="brand-school">โรงเรียนท่าตูมประชาเสริมวิทย์</span>${detail.event.name}<small>เลือกชื่อของท่านแล้วกดยืนยัน</small>`;
        if (detail.event.status !== 'active') {
          document.querySelector('.card').innerHTML = '<div class="empty-state">งานประชุมนี้ปิดรับเช็คชื่อแล้ว</div>';
          return;
        }
      }

      const input = document.getElementById('memberSearch');
      if (!res.ok || !res.roster.length) {
        input.placeholder = 'ไม่มีรายชื่อเหลือให้เช็คชื่อ';
        document.getElementById('submitBtn').disabled = true;
        return;
      }
      fullRoster = res.roster;
      input.disabled = false;
      input.placeholder = 'พิมพ์ชื่อเพื่อค้นหา...';
    }
    init();

    function renderResults(list) {
      const box = document.getElementById('memberResults');
      if (!list.length) {
        box.innerHTML = '<div class="combobox-empty">ไม่พบชื่อที่ค้นหา</div>';
      } else {
        box.innerHTML = list.slice(0, 8).map(m => `
          <div class="combobox-item" data-id="${m.member_id}" data-name="${m.name}">
            ${m.name}${m.department ? ` <span class="dept">(${m.department})</span>` : ''}
          </div>
        `).join('');
      }
      box.classList.add('show');
    }

    const searchInput = document.getElementById('memberSearch');
    searchInput.addEventListener('focus', () => {
      const q = searchInput.value.trim();
      renderResults(q ? filterRoster(q) : fullRoster);
    });
    searchInput.addEventListener('input', () => {
      selectedMemberId = '';
      const q = searchInput.value.trim();
      renderResults(q ? filterRoster(q) : fullRoster);
    });
    function filterRoster(q) {
      const needle = q.toLowerCase();
      return fullRoster.filter(m => m.name.toLowerCase().includes(needle));
    }
    document.getElementById('memberResults').addEventListener('click', (e) => {
      const item = e.target.closest('.combobox-item');
      if (!item || !item.dataset.id) return;
      selectedMemberId = item.dataset.id;
      searchInput.value = item.dataset.name;
      document.getElementById('memberResults').classList.remove('show');
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.combobox')) document.getElementById('memberResults').classList.remove('show');
    });

    document.getElementById('submitBtn').onclick = async () => {
      if (!selectedMemberId) { toast('กรุณาเลือกชื่อจากรายการที่ค้นหา', 'err'); return; }
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
      const res = await apiCall('submitCheckin', { event_id: eventId, member_id: selectedMemberId });
      btn.disabled = false; btn.textContent = '✓ ยืนยันเข้าประชุม';
      if (!res.ok) {
        const msg = res.error === 'already_checked_in' ? 'ชื่อนี้เช็คชื่อไปแล้ว' : 'เกิดข้อผิดพลาด กรุณาลองใหม่';
        toast(msg, 'err');
        return;
      }
      document.getElementById('doneMsg').textContent = `${res.name} — รอเลขาสภายืนยันสิทธิ์`;
      document.querySelector('.wrap .card').style.display = 'none';
      document.getElementById('doneCard').style.display = 'block';
    };
  </script>
</body>
</html>
