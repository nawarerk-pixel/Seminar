<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เช็คชื่อเข้าประชุม</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand" id="eventTitle">เช็คชื่อเข้าประชุม<small>เลือกชื่อของท่านแล้วกดยืนยัน</small></div>
    <a href="index.html" class="btn outline sm" style="color:#fff;border-color:rgba(255,255,255,0.35)">← งานอื่น</a>
  </div>

  <div class="wrap" style="max-width:560px">
    <div class="card">
      <div class="field">
        <label>ชื่อ-นามสกุลของท่าน</label>
        <select id="memberSelect"><option>กำลังโหลดรายชื่อ...</option></select>
      </div>
      <button class="btn brass block" id="submitBtn">✓ ยืนยันเข้าประชุม</button>
      <p class="muted" style="margin-top:10px">หลังกดยืนยันแล้ว รายชื่อของท่านจะรอเลขาสภาตรวจสอบและยืนยันสิทธิ์อีกครั้ง</p>
    </div>

    <div class="card" id="doneCard" style="display:none;text-align:center">
      <div style="font-size:2.4rem">✅</div>
      <h2 style="font-size:1.3rem;margin:6px 0">เช็คชื่อสำเร็จ</h2>
      <p class="muted" id="doneMsg"></p>
      <button class="btn outline block" style="margin-top:12px" onclick="location.reload()">เช็คชื่อคนถัดไป</button>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const eventId = qs('event');
    if (!eventId) document.body.innerHTML = '<div class="wrap"><div class="card">ไม่พบงานประชุม กรุณากลับไปหน้าเลือกงาน</div></div>';

    async function init() {
      const detail = await apiCall('getEventDetail', { event_id: eventId });
      if (detail.ok) {
        document.getElementById('eventTitle').innerHTML =
          `${detail.event.name}<small>เลือกชื่อของท่านแล้วกดยืนยัน</small>`;
        if (detail.event.status !== 'active') {
          document.querySelector('.card').innerHTML = '<div class="empty-state">งานประชุมนี้ปิดรับเช็คชื่อแล้ว</div>';
          return;
        }
      }
      const res = await apiCall('getRoster', { event_id: eventId });
      const sel = document.getElementById('memberSelect');
      if (!res.ok || !res.roster.length) {
        sel.innerHTML = '<option>ไม่มีรายชื่อเหลือให้เช็คชื่อ</option>';
        document.getElementById('submitBtn').disabled = true;
        return;
      }
      sel.innerHTML = '<option value="">— เลือกชื่อ —</option>' +
        res.roster.map(m => `<option value="${m.member_id}">${m.name}${m.department ? ' (' + m.department + ')' : ''}</option>`).join('');
    }
    init();

    document.getElementById('submitBtn').onclick = async () => {
      const sel = document.getElementById('memberSelect');
      const memberId = sel.value;
      if (!memberId) { toast('กรุณาเลือกชื่อก่อน', 'err'); return; }
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
      const res = await apiCall('submitCheckin', { event_id: eventId, member_id: memberId });
      btn.disabled = false; btn.textContent = '✓ ยืนยันเข้าประชุม';
      if (!res.ok) {
        const msg = res.error === 'already_checked_in' ? 'ชื่อนี้เช็คชื่อไปแล้ว' : 'เกิดข้อผิดพลาด กรุณาลองใหม่';
        toast(msg, 'err');
        return;
      }
      document.getElementById('doneMsg').textContent = `${res.name} — รอเลขาสภายืนยันสิทธิ์`;
      document.querySelector('.wrap .card').style.display = 'none';
      document.getElementById('doneCard').style.display = 'block';
    };
  </script>
</body>
</html>
