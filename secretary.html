<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เลขาสภา — ยืนยันสิทธิ์เข้าประชุม</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .pending-item { display:flex; align-items:center; gap:12px; padding:12px; border:1.5px solid var(--line); border-radius:10px; margin-bottom:8px; background:#fff; }
  .pending-item input[type=checkbox] { width:20px; height:20px; }
  .pending-item .name { font-weight:600; flex:1; }
  .pending-item .dept { font-size:0.8rem; color:var(--ink-soft); }
  .toolbar { display:flex; gap:10px; margin-bottom: 14px; flex-wrap:wrap; align-items:center; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand" id="eventTitle">เลขาสภา<small>ยืนยันสิทธิ์ผู้เข้าประชุม</small></div>
    <div style="display:flex;gap:8px">
      <button class="btn outline sm" id="logoutBtn" style="display:none;color:#fff;border-color:rgba(255,255,255,0.35)">ออกจากระบบ</button>
      <a href="index.html" class="btn outline sm" style="color:#fff;border-color:rgba(255,255,255,0.35)">← หน้าหลัก</a>
    </div>
  </div>

  <div class="wrap">
    <!-- PIN gate -->
    <div class="card" id="pinCard">
      <label>รหัส PIN แอดมิน/เลขา</label>
      <div style="display:flex;gap:10px">
        <input type="password" id="pinInput" placeholder="กรอก PIN">
        <button class="btn brass" id="pinBtn">เข้าสู่ระบบ</button>
      </div>
    </div>

    <div id="mainArea" style="display:none">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
          <div>
            <div class="muted" id="quorumInfo">—</div>
          </div>
          <div style="display:flex;gap:10px">
            <a target="_blank" id="displayLink" class="btn outline sm">เปิดจอแสดงผล ↗</a>
            <button class="btn green" id="startBtn">▶ เริ่มประชุม</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <h2 style="font-size:1.05rem;flex:1">รายชื่อรอยืนยันสิทธิ์ (<span id="pendingCount">0</span>)</h2>
          <button class="btn outline sm" id="selectAllBtn">เลือกทั้งหมด</button>
          <button class="btn brass sm" id="confirmSelectedBtn">✓ ยืนยันที่เลือก</button>
        </div>
        <div id="pendingList"><p class="muted">กำลังโหลด...</p></div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const eventId = qs('event');
    let currentPin = getSavedPin();

    document.getElementById('displayLink').href = 'display.html?event=' + encodeURIComponent(eventId);

    async function tryPin(pin) {
      const v = await apiCall('verifyPin', { pin });
      if (v.ok && v.valid) {
        currentPin = pin;
        savePin(pin);
        document.getElementById('pinCard').style.display = 'none';
        document.getElementById('mainArea').style.display = 'block';
        document.getElementById('logoutBtn').style.display = 'inline-block';
        loadEvent();
        loadPending();
        setInterval(loadPending, 8000);
      } else {
        toast('PIN ไม่ถูกต้อง', 'err');
      }
    }

    if (currentPin) tryPin(currentPin);

    document.getElementById('pinBtn').onclick = () => tryPin(document.getElementById('pinInput').value);
    document.getElementById('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryPin(e.target.value); });

    document.getElementById('logoutBtn').onclick = () => {
      clearPin();
      currentPin = '';
      document.getElementById('pinInput').value = '';
      document.getElementById('mainArea').style.display = 'none';
      document.getElementById('logoutBtn').style.display = 'none';
      document.getElementById('pinCard').style.display = 'block';
    };

    async function loadEvent() {
      const res = await apiCall('getEventDetail', { event_id: eventId });
      if (res.ok) {
        document.getElementById('eventTitle').innerHTML = `${res.event.name}<small>ยืนยันสิทธิ์ผู้เข้าประชุม</small>`;
        document.getElementById('quorumInfo').textContent =
          `เกณฑ์องค์ประชุม ${res.event.quorum_pct}%` + (res.event.meeting_started_at ? ' · เริ่มประชุมแล้ว' : ' · ยังไม่เริ่มประชุม');
      }
    }

    async function loadPending() {
      const res = await apiCall('getStatus', { event_id: eventId });
      if (!res.ok) return;
      document.getElementById('pendingCount').textContent = res.pending_count;
      const list = document.getElementById('pendingList');
      if (!res.pending_list.length) {
        list.innerHTML = '<p class="muted">ไม่มีรายชื่อรอยืนยัน</p>';
        return;
      }
      list.innerHTML = res.pending_list.map(m => `
        <label class="pending-item">
          <input type="checkbox" class="pendChk" value="${m.member_id}">
          <span class="name">${m.name}${m.is_late ? ' 🔸' : ''}</span>
          <span class="dept">${m.department || ''}</span>
          <button class="btn green sm" onclick="confirmOne('${m.member_id}')">ยืนยัน</button>
        </label>
      `).join('');
    }

    async function confirmOne(memberId) {
      const res = await apiCall('secretaryConfirm', { event_id: eventId, member_ids: [memberId], pin: currentPin });
      if (res.ok) { toast('ยืนยันสิทธิ์แล้ว', 'ok'); loadPending(); }
      else toast('ยืนยันไม่สำเร็จ', 'err');
    }

    document.getElementById('selectAllBtn').onclick = () => {
      document.querySelectorAll('.pendChk').forEach(c => c.checked = true);
    };

    document.getElementById('confirmSelectedBtn').onclick = async () => {
      const ids = Array.from(document.querySelectorAll('.pendChk:checked')).map(c => c.value);
      if (!ids.length) { toast('กรุณาเลือกรายชื่อก่อน', 'err'); return; }
      const res = await apiCall('secretaryConfirm', { event_id: eventId, member_ids: ids, pin: currentPin });
      if (res.ok) { toast(`ยืนยันสิทธิ์ ${res.confirmed_count} คนแล้ว`, 'ok'); loadPending(); }
      else toast('ยืนยันไม่สำเร็จ', 'err');
    };

    document.getElementById('startBtn').onclick = async () => {
      if (!confirm('เริ่มประชุมตอนนี้ใช่หรือไม่? คนที่เช็คชื่อหลังจากนี้จะถูกมาร์คว่ามาสาย')) return;
      const res = await apiCall('startMeeting', { event_id: eventId, pin: currentPin });
      if (res.ok) { toast('เริ่มประชุมแล้ว', 'ok'); loadEvent(); }
      else toast('ไม่สำเร็จ', 'err');
    };
  </script>
</body>
</html>
