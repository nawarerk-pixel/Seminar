<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เลือกงานประชุม — ระบบเช็คชื่อองค์ประชุม</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">ระบบเช็คชื่อองค์ประชุม<small>เลือกงานประชุมที่ต้องการ</small></div>
    <a href="admin.html" class="btn outline sm" style="color:#fff;border-color:rgba(255,255,255,0.35)">แอดมิน</a>
  </div>

  <div class="wrap">
    <div class="card" id="listCard">
      <h2 style="margin-bottom:14px;font-size:1.15rem">งานประชุมที่เปิดอยู่</h2>
      <div id="eventList"><p class="muted">กำลังโหลด...</p></div>
    </div>
    <p class="muted" style="text-align:center">ไม่เจองานที่ต้องการ? งานเก่าที่ปิดแล้วดูได้ที่หน้า
      <a href="admin.html" style="color:var(--brass);font-weight:600">แอดมิน</a></p>
  </div>

  <script src="app.js"></script>
  <script>
    async function loadEvents() {
      const el = document.getElementById('eventList');
      const res = await apiCall('listEvents', { filter: 'active' });
      if (!res.ok) { el.innerHTML = '<p class="muted">โหลดข้อมูลไม่สำเร็จ</p>'; return; }
      if (!res.events.length) {
        el.innerHTML = '<div class="empty-state">ยังไม่มีงานประชุมที่เปิดอยู่ตอนนี้<br><span class="muted">ให้แอดมินสร้างงานใหม่ก่อน</span></div>';
        return;
      }
      el.innerHTML = res.events.map(ev => `
        <a class="event-item" href="checkin.html?event=${encodeURIComponent(ev.event_id)}">
          <div>
            <div style="font-weight:600">${ev.name}</div>
            <div class="meta">${fmtDate(ev.date)} · เกณฑ์องค์ประชุม ${ev.quorum_pct}%</div>
          </div>
          <span class="pill brass">เช็คชื่อ →</span>
        </a>
      `).join('');
    }
    loadEvents();
  </script>
</body>
</html>
